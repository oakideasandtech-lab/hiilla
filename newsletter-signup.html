<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Newsletter Signup - HIILLA - Bike Delivery Faster Than Anyone Else.</title>
  <meta name="description" content="Sign up for the HIILLA newsletter to get the latest updates on deliveries, dispatches, and fleet partnerships." />
  <link rel="canonical" href="https://hiilla.com/newsletter-signup/" />
  <link rel="icon" href="assets/favicon.png" type="image/png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="site-header-mount"></div>

  <main id="main" class="section">
    <div class="container">
      <div class="text-center" style="margin-bottom:48px;">
        <h1>Newsletter Signup</h1>
        <p style="max-width:640px;margin:16px auto;">Stay up to date with HIILLA&rsquo;s latest news, promotions, and updates delivered straight to your inbox.</p>
      </div>

      <div class="form-panel">
        <form id="newsletter-form" class="newsletter-form" novalidate>
          <div class="form-field">
            <label for="newsletter-email">Email Address *</label>
            <input type="email" id="newsletter-email" name="email" autocomplete="email" placeholder="you@example.com" required />
          </div>
          <div class="form-field">
            <label for="newsletter-name">Name</label>
            <input type="text" id="newsletter-name" name="name" autocomplete="name" />
          </div>
          <div class="form-field">
            <label><input type="checkbox" name="agree" required style="width:auto;margin-right:8px;" /> I agree to receive newsletter emails from HIILLA.</label>
          </div>
          <div class="form-field">
            <button type="submit" class="btn">Subscribe</button>
          </div>
          <p id="newsletter-status" role="status" aria-live="polite"></p>
        </form>
      </div>
    </div>
  </main>

  <div id="site-footer-mount"></div>

  <script src="js/layout.js"></script>
  <script src="js/main.js"></script>
  <script>
    (function () {
      var form = document.getElementById("newsletter-form");
      var status = document.getElementById("newsletter-status");
      if (!form || !status) return;

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        status.textContent = "Thank you for subscribing! Please check your inbox to confirm.";
        status.style.color = "#27ae60";
        form.reset();
      });
    })();
  </script>
</body>
</html>
